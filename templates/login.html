<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Login</title>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
</head>
<body>
    <main class="container" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
        <h2>Connexion</h2>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form method="POST" style="width: 100%; max-width: 400px;">
            <input type="text" name="username" placeholder="Nom d'utilisateur" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <a href="/reset">Mot de passe oublié ?</a>
        <br>
        {% if flag_enum %}
            <p style="color: gold;">{{ flag_enum }}</p>
        {% endif %}
        <p>🔒 Bruteforce protection provided by SecureTom.</p>
        <a href="/dev" style="font-size: 0.8em; text-decoration: none; color: #1a3d5d;">Page développeur</a>
    </main>
</body>
</html>
