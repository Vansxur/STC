<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"></head>
</head>
<body>
    <main class="container" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
        <h2>Config</h2>
        <form method="POST">
            <input type="number" name="role" placeholder="Role Id" required>
            <button type="submit">Changer de rôle</button>
        </form>
<br>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
        <a href="/">Retour à l'accueil</a>
    </main>
</body>
</html>
